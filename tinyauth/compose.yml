# Needed environment variables:
# - TINYAUTH_HOST: The hostname to use for the tinyauth service.
# - TINYAUTH_USERS: A comma-separated list of users in the format username:password_hash.
services:
  tinyauth:
    container_name: tinyauth
    image: ghcr.io/steveiliop56/tinyauth:v5
    pull_policy: build
    restart: unless-stopped
    environment:
      - TINYAUTH_UI_TITLE=NERV-HQ
      - TINYAUTH_APPURL=https://${TINYAUTH_HOST}
      - TINYAUTH_AUTH_USERS=${TINYAUTH_USERS}
    networks:
      - proxy
    volumes:
      - /appdata/tinyauth:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.http.routers.tinyauth.rule=Host(`${TINYAUTH_HOST}`)
      - traefik.http.middlewares.tinyauth.forwardauth.address=http://tinyauth:3000/api/auth/traefik
      - traefik.http.routers.tinyauth.entrypoints=websecure
      - traefik.http.routers.tinyauth.tls.certresolver=cloudflare
networks:
  proxy:
    external: true
