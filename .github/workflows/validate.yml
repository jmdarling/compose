name: Validate
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - name: Validate Compose configurations without secrets or services
        run: |
          for file in */compose.yml; do
            docker compose -f "$file" config --no-interpolate --no-env-resolution --quiet
          done
